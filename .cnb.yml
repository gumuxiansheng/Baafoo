master:
  push:
    - name: code-gate
      runner:
        cpus: 2
      docker:
        image: rust:1.77-bookworm
      stages:
        - name: compile-sql-guard
          script: |
            git clone https://cnb.cool/mikezhu/sql-guard.git /tmp/sql-guard
            cd /tmp/sql-guard
            cargo build --release --bin sqlguard
            cp target/release/sqlguard $PWD/tools/sql-guard/bin/sqlguard
            chmod +x $PWD/tools/sql-guard/bin/sqlguard
        - name: compile-java-guard
          script: |
            git clone https://cnb.cool/mikezhu/java-guard.git /tmp/java-guard
            cd /tmp/java-guard
            cargo build --release
            cp target/release/java-guard $PWD/tools/java-guard/bin/java-guard
            chmod +x $PWD/tools/java-guard/bin/java-guard
        - name: sql-guard-check
          stage: check
          script: |
            ./tools/sql-guard/bin/sqlguard check \
              -c tools/sql-guard/sqlguard.toml \
              -f json -o sqlguard-reports/ \
              baafoo-server/src/main/resources
        - name: java-guard-check
          stage: check
          script: |
            export JAVAGUARD_PARSER_JAR="$PWD/tools/java-guard/java-parser/java-parser.jar"
            apt-get update -qq && apt-get install -y -qq default-jdk-headless > /dev/null 2>&1 || true
            java -version 2>&1 || true
            MODULES="baafoo-agent baafoo-cli baafoo-core baafoo-plugin-api baafoo-server baafoo-spring-boot-starter-test"
            for MOD in $MODULES; do
              SRC="$PWD/$MOD/src/main/java"
              [ ! -d "$SRC" ] && continue
              echo "==> JavaGuard scanning $MOD"
              ./tools/java-guard/bin/java-guard scan "$SRC" \
                --config tools/java-guard/java-guard.yml \
                --gate --gate-config tools/java-guard/gate-config.yml \
                -f console
            done

    - name: test-and-build
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-8
        volumes:
          - /root/.m2:copy-on-write
      env:
        MAVEN_CONFIG: ""
      stages:
        - name: test-core
          script: ./mvnw test -pl baafoo-core -am
        - name: test-agent
          script: ./mvnw test -pl baafoo-agent -am -DskipTests=false
        - name: test-server
          script: ./mvnw test -pl baafoo-server -am -DskipTests=false -Dnpm.skip=true
        - name: test-all
          script: ./mvnw verify -Dnpm.skip=true
        - name: coverage-debug
          script: |
            echo "=== per-module jacoco reports ==="
            find . -path '*/target/site/jacoco/jacoco.xml' | sort
            echo "=== aggregate report (if any) ==="
            ls -la baafoo-coverage/target/site/jacoco-aggregate/ 2>&1 || true
        - name: coverage
          type: testing:coverage
          options:
            pattern: "**/target/site/jacoco/jacoco.xml"
            breakIfNoCoverage: false
          exports:
            lines: COVERAGE_LINES
        - name: coverage-result
          script: echo "单元测试行覆盖率:${COVERAGE_LINES}%"
        - name: mutation-testing
          script: bash testing/1_UnitTest/run-mutation.sh --module baafoo-core
        - name: mutation-summary
          script: |
            REPORT=$(ls -t baafoo-core/target/pit-reports/mutations.xml 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              echo "PIT mutation XML: $REPORT"
              grep -o 'mutationScore="[0-9.]*"' "$REPORT" | head -1 || true
            else
              echo "No PIT mutation report generated"
            fi
        - name: package
          script: ./mvnw package -DskipTests -Dnpm.skip=true
      endStages:
        - name: check-artifacts
          script: ls -lh baafoo-server/target/baafoo-server-*.jar baafoo-agent/target/baafoo-agent-*.jar

    - name: build-frontend
      ifModify:
        - web/**/*
        - web/*
      docker:
        image: node:20
        volumes:
          - /root/.npm:copy-on-write
      stages:
        - name: install
          script: |
            cd web
            npm ci
        - name: build
          script: |
            cd web
            npm run build

  pull_request:
    - name: pr-code-gate
      runner:
        cpus: 2
      docker:
        image: rust:1.77-bookworm
      stages:
        - name: compile-sql-guard
          script: |
            git clone https://cnb.cool/mikezhu/sql-guard.git /tmp/sql-guard
            cd /tmp/sql-guard
            cargo build --release --bin sqlguard
            cp target/release/sqlguard $PWD/tools/sql-guard/bin/sqlguard
            chmod +x $PWD/tools/sql-guard/bin/sqlguard
        - name: compile-java-guard
          script: |
            git clone https://cnb.cool/mikezhu/java-guard.git /tmp/java-guard
            cd /tmp/java-guard
            cargo build --release
            cp target/release/java-guard $PWD/tools/java-guard/bin/java-guard
            chmod +x $PWD/tools/java-guard/bin/java-guard
        - name: sql-guard-incremental
          stage: check
          script: |
            git fetch origin ${{ cnb.pull_request.base_ref }}
            ./tools/sql-guard/bin/sqlguard check-diff \
              --base origin/${{ cnb.pull_request.base_ref }} \
              -c tools/sql-guard/sqlguard.toml \
              -f json -o sqlguard-reports/ \
              baafoo-server/src/main/resources
        - name: java-guard-incremental
          stage: check
          script: |
            export JAVAGUARD_PARSER_JAR="$PWD/tools/java-guard/java-parser/java-parser.jar"
            apt-get update -qq && apt-get install -y -qq default-jdk-headless > /dev/null 2>&1 || true
            MODULES="baafoo-agent baafoo-cli baafoo-core baafoo-plugin-api baafoo-server baafoo-spring-boot-starter-test"
            for MOD in $MODULES; do
              SRC="$PWD/$MOD/src/main/java"
              [ ! -d "$SRC" ] && continue
              echo "==> JavaGuard scanning $MOD"
              ./tools/java-guard/bin/java-guard scan "$SRC" \
                --config tools/java-guard/java-guard.yml \
                --gate --gate-config tools/java-guard/gate-config.yml \
                --diff origin/${{ cnb.pull_request.base_ref }}..HEAD \
                -f console
            done

    - name: pr-check
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-8
        volumes:
          - /root/.m2:copy-on-write
      env:
        MAVEN_CONFIG: ""
      stages:
        - name: test-core
          script: ./mvnw test -pl baafoo-core -am
        - name: test-server
          script: ./mvnw test -pl baafoo-server -am -DskipTests=false -Dnpm.skip=true
        - name: test-agent
          script: ./mvnw test -pl baafoo-agent -am -DskipTests=false
        - name: coverage-aggregate
          script: ./mvnw verify -pl baafoo-coverage -am -DskipTests -Dnpm.skip=true
        - name: coverage
          type: testing:coverage
          options:
            pattern: "**/target/site/jacoco/jacoco.xml"
            breakIfNoCoverage: false
          exports:
            lines: COVERAGE_LINES
        - name: coverage-result
          script: echo "本次 PR 单元测试行覆盖率:${COVERAGE_LINES}%"
        - name: mutation-testing
          script: bash testing/1_UnitTest/run-mutation.sh --module baafoo-core
        - name: mutation-summary
          script: |
            REPORT=$(ls -t baafoo-core/target/pit-reports/mutations.xml 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              echo "PIT mutation XML: $REPORT"
              grep -o 'mutationScore="[0-9.]*"' "$REPORT" | head -1 || true
            else
              echo "No PIT mutation report generated"
            fi
        - name: package
          script: ./mvnw package -DskipTests -Dnpm.skip=true
      failStages:
        - name: notify-failure
          script: echo "PR checks failed for $CNB_BRANCH"

  pull_request.mergeable:
    - name: auto-merge
      stages:
        - name: merge
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true

"feature/*":
  push:
    - name: quick-test
      ifModify:
        - "**/*.java"
        - "**/*.xml"
      runner:
        cpus: 2
      docker:
        image: maven:3.9-eclipse-temurin-8
        volumes:
          - /root/.m2:copy-on-write
      env:
        MAVEN_CONFIG: ""
      stages:
        - name: test-affected
          script: |
            ./mvnw test -pl baafoo-core -am
            if [ $? -eq 0 ]; then
              ./mvnw test -pl baafoo-server -am -DskipTests=false -Dnpm.skip=true
            fi

"hotfix/*":
  push:
    - name: hotfix-test
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-8
        volumes:
          - /root/.m2:copy-on-write
      env:
        MAVEN_CONFIG: ""
      stages:
        - name: test-all
          script: ./mvnw test -Dnpm.skip=true
        - name: mutation-testing
          script: bash testing/1_UnitTest/run-mutation.sh --module baafoo-core
        - name: mutation-summary
          script: |
            REPORT=$(ls -t baafoo-core/target/pit-reports/mutations.xml 2>/dev/null | head -1)
            if [ -n "$REPORT" ]; then
              echo "PIT mutation XML: $REPORT"
              grep -o 'mutationScore="[0-9.]*"' "$REPORT" | head -1 || true
            else
              echo "No PIT mutation report generated"
            fi
        - name: package
          script: ./mvnw package -DskipTests -Dnpm.skip=true

$:
  tag_push:
    - name: release
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-8
        volumes:
          - /root/.m2:copy-on-write
      env:
        MAVEN_CONFIG: ""
      services:
        - docker
      stages:
        - name: test
          script: ./mvnw test -Dnpm.skip=true
        - name: package
          script: ./mvnw package -DskipTests -Dnpm.skip=true
        - name: build-and-push-image
          script: |
            docker build -t docker.cnb.cool/$CNB_REPO_SLUG/baafoo-server:$CNB_BRANCH .
            docker tag docker.cnb.cool/$CNB_REPO_SLUG/baafoo-server:$CNB_BRANCH docker.cnb.cool/$CNB_REPO_SLUG/baafoo-server:latest
            docker push docker.cnb.cool/$CNB_REPO_SLUG/baafoo-server:$CNB_BRANCH
            docker push docker.cnb.cool/$CNB_REPO_SLUG/baafoo-server:latest
      endStages:
        - name: release-notes
          image: cnbcool/changelog
          settings:
            latestChangeLogTarget: RELEASE.md

  branch.delete:
    - name: cleanup
      stages:
        - name: log-deletion
          script: echo "Branch $CNB_BRANCH deleted"