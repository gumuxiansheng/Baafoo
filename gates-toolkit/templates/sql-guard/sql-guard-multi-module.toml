# SqlGuard 配置 — 多模块 Maven 项目
# 注意：实际使用时需要把 {{MAPPER_PATHS}} 替换为各 SQL/Mapper 模块路径（逗号分隔的带引号列表）

dialect = "postgresql"

[structure]
paths = []
strict = false

[[classification.rules]]
name = "ddl-by-ext"
pattern = "**/*.sql"
type = "ddl"
priority = 10

[[classification.rules]]
name = "dml-by-ext"
pattern = "**/*.dml"
type = "dml"
priority = 10

rules_file = "sqlguard.rules.toml"

[output]
formats = ["plain", "json"]

[mapper]
enabled = true
# 注意：paths 相对「扫描根（check/check-diff 的 PATH 参数）」解析，非 CWD 也非配置文件目录。
# 统一约定：从项目根运行，PATH 传 "."（pre-commit / gatecheck / CI 均已按此处理）。
paths = [{{MAPPER_PATHS}}]
# mapper 目录下全部 XML 均扫描（不要求以 Mapper.xml 结尾，覆盖 XxxViolation.xml 等命名）
patterns = ["**/*.xml"]

[scan]
exclude_dirs = [
  ".git", ".svn", ".hg", ".bzr",
  "target", "node_modules", "build", "dist", "out",
  ".idea", ".vscode",
]

[file_check]
enabled = true
check_encoding = true
check_line_ending = false
encoding_severity = "error"
line_ending_severity = "warning"
