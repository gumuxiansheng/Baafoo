# wan workflow: 仅 JavaGuard 检查 (Spring Boot 单模块, Windows)
# 由 setup-gates 生成，工作目录为项目根（通过 wan -C 传入）
# 增量检查：仅扫描 git diff HEAD 改动的文件
# 用法: gates-tools\wan\bin\wan.exe run java-guard -C .
version: 1
env:
  JAVAGUARD_PARSER_JAR: gates-tools/java-guard/java-parser/java-parser.jar
jobs:
  java-guard-check:
    steps:
      - name: JavaGuard 扫描
        shell: pwsh
        run: |
          $javaguard = "gates-tools/java-guard/bin/java-guard.exe"
          $config = "gates-tools/java-guard/java-guard.yml"
          $gateConfig = "gates-tools/java-guard/gate-config.yml"
          $rulesDir = "gates-tools/java-guard/rules"
          $srcPath = "{{BACKEND_DIR}}/src/main/java"
          if (-not (Test-Path $srcPath)) { Write-Host "跳过: 源码目录不存在"; exit 0 }
          Write-Host "==> JavaGuard 增量扫描 (diff: HEAD)"
          & $javaguard scan $srcPath --rules-dir $rulesDir --config $config --gate --gate-config $gateConfig --diff HEAD -f console
          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "✗ JavaGuard 门禁未通过" -ForegroundColor Red
            exit 1
          }
          Write-Host "✓ JavaGuard 检查通过"
