# JavaGuard 配置 — 多模块 Maven 项目
# 扫描列表中的多个模块 src/main/java

rules:
  min_severity: info
  # J014/J015（非 jackson JSON 框架检测）默认关闭，避免存量违规使门禁全红。
  # 如需启用：删除下面两行，并先用 --baseline 抑制已知存量。
  disable:
    - J014
    - J015
  params:
    J006:
      max_lines: 50

scan:
  exclude:
    - generated
    - target
    - test

# 多模块列表 — 实际使用时由 setup-gates 注入
modules: {{MODULES_LIST}}
