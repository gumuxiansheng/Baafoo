# JavaGuard 配置 — Spring Boot 单模块项目
# 扫描 backend/src/main/java 下的 Java 源码

rules:
  min_severity: info
  # J014/J015（非 jackson JSON 框架检测）默认关闭，避免存量违规使门禁全红。
  # 如需启用：删除下面两行，并先用 --baseline 抑制已知存量。
  disable:
    - J014
    - J015
  params:
    J006:
      max_lines: 50

scan:
  exclude:
    - generated
    - target
    - test
