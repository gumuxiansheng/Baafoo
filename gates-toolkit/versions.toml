# gates-toolkit 版本配置
#
# 人工填写每个工具各平台二进制的下载地址。
# 脚本 fetch-binaries.ps1 / fetch-binaries.sh 读取此文件下载二进制到 bin/。
#
# URL 可以是任意可公开访问的直链（CNB Release 附件、GitHub Release Asset、对象存储等）。
# 留空 "" 表示该平台暂不提供，下载时会跳过并告警。
#
# version 字段用于版本比较：本地存在同版本时跳过下载，低于配置版本时自动更新。

[wan]
version = "0.1.5"

  [wan.windows_amd64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.5/wan-windows-amd64.exe"
  # 例: "https://cnb.cool/mikezhu/wan/-/releases/tag/v0.1.0/downloads/wan-windows-amd64.exe"
  filename = "wan.exe"

  [wan.windows_amd64_shim]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.5/wan-shim-windows-amd64.exe"
  filename = "wan-shim.exe"

  [wan.linux_arm64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.5/wan-linux-arm64"
  filename = "wan-linux-arm64"

  [wan.linux_amd64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.5/wan-linux-amd64"
  filename = "wan-linux-amd64"

[sql-guard]
version = "0.2.2"

  [sql-guard.windows_amd64]
  url = "https://cnb.cool/mikezhu/sql-guard/-/releases/download/v0.2.2/sqlguard-x86_64-pc-windows-gnu.exe"
  filename = "sqlguard.exe"

  [sql-guard.linux_arm64]
  url = "https://cnb.cool/mikezhu/sql-guard/-/releases/download/v0.2.2/sqlguard-aarch64-unknown-linux-musl"
  filename = "sqlguard-linux-arm64"

  [sql-guard.linux_amd64]
  url = "https://cnb.cool/mikezhu/sql-guard/-/releases/download/v0.2.2/sqlguard-x86_64-unknown-linux-musl"
  filename = "sqlguard-linux-amd64"

[java-guard]
version = "0.1.2"

  [java-guard.windows_amd64]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.2/java-guard-windows-amd64.exe"
  filename = "java-guard.exe"

  [java-guard.linux_arm64]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.2/java-guard-linux-arm64"
  filename = "java-guard-linux-arm64"

  [java-guard.linux_amd64]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.2/java-guard-linux-amd64"
  filename = "java-guard-linux-amd64"

  # java-parser.jar 是平台无关的，只列一次
  [java-guard.java_parser]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.2/java-parser.jar"
  filename = "java-parser.jar"
