# gates-toolkit 版本配置
#
# 人工填写每个工具各平台二进制的下载地址。
# 脚本 fetch-binaries.ps1 / fetch-binaries.sh 读取此文件下载二进制到 bin/。
#
# URL 可以是任意可公开访问的直链（CNB Release 附件、GitHub Release Asset、对象存储等）。
# 留空 "" 表示该平台暂不提供，下载时会跳过并告警。
#
# version 字段用于版本比较：本地存在同版本时跳过下载，低于配置版本时自动更新。
#
# ---- 下载认证/TLS 配置（可选，私有库/内网场景） ----
# [download]
#   token                # 私有库下载 token（如 CNB 私有空间的 token）。
#                        未配置时回退读环境变量 CNB_TOKEN，两者都没有则匿名下载。
#   username             # 认证用户名，默认 "cnb"（等价 curl -u cnb:<token>）
#   insecure_skip_verify # 内网自签 CA 时跳过 TLS 证书校验，设 "true" 开启（curl -k / IWR 跳过校验）
#
# 示例（内网私有库）：
#   [download]
#   username = "cnb"
#   token = "xxxxxxxx"
#   insecure_skip_verify = "true"
#
# 注意：token 会写入本文件，若 versions.toml 随仓库提交，建议改用环境变量 CNB_TOKEN。

[download]
username = "cnb"
token = ""
insecure_skip_verify = "false"

[wan]
version = "0.1.6"

  [wan.windows_amd64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.6/wan-windows-amd64.exe"
  # 例: "https://cnb.cool/mikezhu/wan/-/releases/tag/v0.1.0/downloads/wan-windows-amd64.exe"
  filename = "wan.exe"

  [wan.windows_amd64_shim]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.6/wan-shim-windows-amd64.exe"
  filename = "wan-shim.exe"

  [wan.linux_arm64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.6/wan-linux-arm64"
  filename = "wan-linux-arm64"

  [wan.linux_amd64]
  url = "https://cnb.cool/mikezhu/wan/-/releases/download/v0.1.6/wan-linux-amd64"
  filename = "wan-linux-amd64"

