  url = "https://cnb.cool/mikezhu/sql-guard/-/releases/download/v0.2.3/sqlguard-aarch64-unknown-linux-musl"
  filename = "sqlguard-linux-arm64"

  [sql-guard.linux_amd64]
  url = "https://cnb.cool/mikezhu/sql-guard/-/releases/download/v0.2.3/sqlguard-x86_64-unknown-linux-musl"
  filename = "sqlguard-linux-amd64"

[java-guard]
version = "0.1.4"

  [java-guard.windows_amd64]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.4/java-guard-windows-amd64.exe"
  filename = "java-guard.exe"

  [java-guard.linux_arm64]
  url = "https://cnb.cool/mikezhu/java-guard/-/releases/download/v0.1.4/java-guard-linux-arm64"
  filename = "java-guard-linux-arm64"

  [java-guard.linux_amd64]
