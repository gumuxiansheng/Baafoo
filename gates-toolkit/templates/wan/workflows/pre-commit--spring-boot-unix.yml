# wan workflow: pre-commit gate (Spring Boot 单模块, Linux)
# 由 setup-gates 生成，工作目录为项目根（通过 wan -C 传入）
# 增量检查：仅扫描 git diff HEAD 改动的文件
version: 1
env:
  JAVAGUARD_PARSER_JAR: gates-tools/java-guard/java-parser/java-parser.jar

jobs:
  sql-guard-check:
    steps:
      - name: SqlGuard check
        shell: bash
        run: |
          set -e
          # SqlGuard incremental check (requires sqlguard >= 0.2.2): check-diff diffs
          # to the working tree — staged/unstaged/untracked changes all covered.
          # Must run from project root (git diff outputs CWD-relative paths).
          SG_BIN="gates-tools/sql-guard/bin/sqlguard"
          if [ -f "$SG_BIN.exe" ]; then SG_BIN="$SG_BIN.exe"; fi
          echo "==> SqlGuard incremental check (base: HEAD, uncommitted changes included)"
          "$SG_BIN" check-diff --base HEAD -c gates-tools/sql-guard/sqlguard.toml -f plain .
          echo "✓ SqlGuard passed"

  java-guard-check:
    needs: []
    steps:
      - name: JavaGuard scan
        shell: bash
        run: |
          set -e
          JAVAGUARD="gates-tools/java-guard/bin/java-guard"
          CONFIG="gates-tools/java-guard/java-guard.toml"
          GATE="gates-tools/java-guard/gate-config.yml"
          RULES_FILE="gates-tools/java-guard/javaguard.rules.toml"
          SRC="{{BACKEND_DIR}}/src/main/java"
          [ ! -d "$SRC" ] && { echo "skip: source dir not found"; exit 0; }
          echo "==> JavaGuard incremental scan (diff: HEAD)"
          "$JAVAGUARD" scan "$SRC" --rules-file "$RULES_FILE" --config "$CONFIG" --gate --gate-config "$GATE" --diff HEAD -f console
          echo "✓ JavaGuard passed"

  gate-summary:
    needs: [sql-guard-check, java-guard-check]
    if: success()
    steps:
      - name: Gate passed
        shell: bash
        run: |
          echo "========================================"
          echo "  ✓ All gate checks passed, commit allowed"
          echo "========================================"
